spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:9050}/${DB_NAME:im_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

server.port=9030

server.cors.origins=${FRONT_END_URLFRONT_END_URL:http://localhost:9010}
server.cors.methods=GET,POST,PUT,DELETE,OPTIONS
server.cors.headers=Content-Type,Authorization,X-Request-ID

logging.level.root=INFO
logging.level.com.icu=DEBUG
