name: Create Release and Publish Images

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Select version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  packages: write

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to fetch commit history for release notes

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate New Version & Generate Release Notes
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          # 1. Get the latest release tag (fallback to 0.0.0 if none exists)
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" == "null" ]; then
            LATEST_TAG="0.0.0"
          fi
          
          echo "Latest tag found: $LATEST_TAG"

          # 2. Parse SemVer numbers (handles tags with or without 'v' just in case)
          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          # 3. Calculate new version based on input (NO 'v' prefix added here)
          if [ "$BUMP_TYPE" == "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP_TYPE" == "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$BUMP_TYPE" == "patch" ]; then
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="$MAJOR.$MINOR.$PATCH"
          echo "New version generated: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

          # 4. Collect commit titles since the last release tag
          if [ "$LATEST_TAG" == "0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"- %s")
          else
            # Search using whichever tag format exists
            COMMITS=$(git log "$LATEST_TAG"..HEAD --pretty=format:"- %s")
          fi
          
          if [ -z "$COMMITS" ]; then
            COMMITS="- Maintenance and routine updates"
          fi

          {
            echo "CHANGELOG<<EOF"
            echo "### What's Changed"
            echo "$COMMITS"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.versioning.outputs.new_tag }}
        run: |
          gh release create "$NEW_TAG" \
            --title "Release $NEW_TAG" \
            --notes "$CHANGELOG"

      - name: Lowercase Repository Owner Name for GHCR
        id: string_transform
        run: |
          echo "OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and Push Items Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/items-service
          file: ./services/items-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.string_transform.outputs.OWNER_LC }}/items-service:${{ steps.versioning.outputs.new_tag }}
            ghcr.io/${{ steps.string_transform.outputs.OWNER_LC }}/items-service:latest

      - name: Build and Push Reviews Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/reviews-service
          file: ./services/reviews-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.string_transform.outputs.OWNER_LC }}/reviews-service:${{ steps.versioning.outputs.new_tag }}
            ghcr.io/${{ steps.string_transform.outputs.OWNER_LC }}/reviews-service:latest

      - name: Build and Push Frontend Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/frontend # Adjust context path if frontend is at root `./frontend`
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.string_transform.outputs.OWNER_LC }}/frontend:${{ steps.versioning.outputs.new_tag }}
            ghcr.io/${{ steps.string_transform.outputs.OWNER_LC }}/frontend:latest