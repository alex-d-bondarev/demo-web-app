name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker images
        run: docker compose build
      
      - name: Start services
        run: docker compose up -d
      
      - name: Run Items Service Tests
        run: docker compose exec -T items-service uv run python -m pytest test_items.py -vv
      
      - name: Run Reviews Service Tests
        run: docker compose exec -T reviews-service mvn -f /build/pom.xml test
      
      - name: Stop services
        if: always()
        run: docker compose down
