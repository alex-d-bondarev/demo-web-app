services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: im_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - im_db_data:/var/lib/mysql
    ports:
      - "9050:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - icu-network

  # WireMock Mock Server
  wiremock:
    image: wiremock/wiremock:latest
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
      - ./wiremock/__files:/home/wiremock/__files
    ports:
      - "9040:9040"
    networks:
      - icu-network

   # Items Service (Python/Flask)
  items-service:
    build:
      context: ./services/items-service
      dockerfile: Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: im_db
      DB_USER: root
      DB_PASSWORD: root
      WIREMOCK_URL: http://wiremock:9040
      FLASK_ENV: development
      FLASK_PORT: 9020
    ports:
      - "9020:9020"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./services/items-service:/app
    networks:
      - icu-network

  # Reviews Service (Java/Spring Boot)
  reviews-service:
    build:
      context: ./services/reviews-service
      dockerfile: Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: im_db
      DB_USER: root
      DB_PASSWORD: root
      FRONT_END_URL: http://localhost:9010
      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:9031"
    ports:
      - "9030:9030"
      - "9031:9031"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - icu-network

  # Frontend Service (Node.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      ITEMS_SERVICE_URL: http://items-service:9020
      REVIEWS_SERVICE_URL: http://reviews-service:9030
      NODE_ENV: development
    ports:
      - "9010:9010"
    depends_on:
      - items-service
      - reviews-service
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - icu-network

volumes:
  im_db_data:
    driver: local

networks:
  icu-network:
    driver: bridge
