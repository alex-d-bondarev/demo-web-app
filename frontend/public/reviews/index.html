<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews Management - IM</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main>
        <div id="message" class="message"></div>
        
        <div class="container">
            <h2>Reviews Management</h2>
            
            <button class="btn-primary" onclick="window.location.href = '/reviews/create'">New Review</button>
            <button class="btn-secondary" onclick="loadReviews()">Refresh Reviews</button>

            <!-- List Reviews -->
            <div id="reviewsTable"></div>
        </div>
    </main>
    
    <script src="/app.js"></script>
    <script src="/config.js"></script>
    <script>
        const REVIEWS_URL = window.APP_CONFIG?.REVIEWS_SERVICE_URL || (window.location.protocol + '//' + window.location.hostname + ':9030');
        
        // Load reviews
        async function loadReviews() {
            const result = await API.fetchAPI(`${REVIEWS_URL}/review`);
            
            if (result.success && Array.isArray(result.data)) {
                let html = '<table><thead><tr><th>Review ID</th><th>Status</th><th>Start Date</th><th>End Date</th><th>Actions</th></tr></thead><tbody>';
                result.data.forEach(review => {
                    html += `
                        <tr>
                            <td>${review.review_id}</td>
                            <td>${review.status}</td>
                            <td>${review.start_dt}</td>
                            <td>${review.end_dt}</td>
                            <td>
                                <button class="btn-primary" onclick="window.location.href = '/reviews/edit/${review.review_id}';">Edit</button>
                                <button class="btn-danger" onclick="deleteReview(${review.review_id})">Delete</button>
                            </td>
                        </tr>
                    `;
                });
                html += '</tbody></table>';
                document.getElementById('reviewsTable').innerHTML = html;
            } else {
                document.getElementById('reviewsTable').innerHTML = '<p>Error loading reviews</p>';
            }
        }
        
        // Delete review
        async function deleteReview(reviewId) {
            if (!confirm(`Delete review ${reviewId}?`)) return;
            
            const result = await API.fetchAPI(`${REVIEWS_URL}/review/${reviewId}`, {
                method: 'DELETE'
            });
            
            if (result.success && result.data.status === 'deleted') {
                API.showMessage('Review deleted successfully', 'success');
                await loadReviews();
            } else {
                API.showMessage('Error deleting review', 'error');
            }
        }
        
        // Load reviews on page load
        window.onload = loadReviews;
    </script>
</body>
</html>
