<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Item - IM</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    
    <main>
        <div id="successModal" class="modal-overlay hidden">
            <div class="modal-content">
                <h3>Item #<span id="successItemId"></span> updated successfully</h3>
                <div class="modal-buttons">
                    <button class="btn-secondary" id="backToItems">Back to all items</button>
                    <button class="btn-primary" id="continueEdit">Continue editing</button>
                </div>
            </div>
        </div>
        
        <div id="errorModal" class="modal-overlay hidden error-frame">
            <div class="modal-content">
                <h3>Failed to save changes</h3>
                <div class="modal-buttons">
                    <button class="btn-secondary" id="okError">OK</button>
                </div>
            </div>
        </div>
        
        <form id="editItemForm" class="hidden">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="optimal_stock">Optimal Stock</label>
                <input type="number" id="optimal_stock" name="optimal_stock" required>
            </div>
            <div class="form-group">
                <label for="volume">Volume</label>
                <input type="number" id="volume" name="volume" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="weight">Weight</label>
                <input type="number" id="weight" name="weight" step="0.01" required>
            </div>
            <button type="submit" class="btn-primary">Save Changes</button>
        </form>
    </main>
    
    <script src="/app.js"></script>
    <script src="/config.js"></script>
    <script>
        const ITEMS_URL = window.APP_CONFIG?.ITEMS_SERVICE_URL || (window.location.protocol + '//' + window.location.hostname + ':9020');
        
        // Extract item ID from URL path
        const pathParts = window.location.pathname.split('/');
        const itemId = pathParts[pathParts.length - 1];
        
        let originalData = null;
        
        async function loadItem() {
            try {
                const result = await API.fetchAPI(`${ITEMS_URL}/item/${itemId}`);
                
                if (result.success && result.data) {
                    originalData = result.data;
                    
                    // Show header
                    document.getElementById('successItemId').textContent = itemId;
                    
                    // Pre-fill form
                    document.getElementById('name').value = result.data.name;
                    document.getElementById('optimal_stock').value = result.data.optimal_stock;
                    document.getElementById('volume').value = result.data.volume;
                    document.getElementById('weight').value = result.data.weight;
                    
                    // Show form
                    document.getElementById('editItemForm').classList.remove('hidden');
                } else {
                    // Item not found
                    document.body.innerHTML = `<main><div class="container"><h2>404 Item #${itemId} not found</h2></div></main>`;
                }
            } catch (err) {
                console.error('Failed to load item:', err);
                document.body.innerHTML = `<main><div class="container"><h2>404 Item #${itemId} not found</h2></div></main>`;
            }
        }
        
        function showSuccessModal() {
            document.getElementById('successItemId').textContent = itemId;
            document.getElementById('successModal').classList.remove('hidden');
            trapFocus(document.getElementById('successModal'));
        }
        
        function showErrorModal() {
            document.getElementById('errorModal').classList.remove('hidden');
            trapFocus(document.getElementById('errorModal'));
        }
        
        function hideModals() {
            document.getElementById('successModal').classList.add('hidden');
            document.getElementById('errorModal').classList.add('hidden');
            releaseFocusTrap();
        }
        
        function trapFocus(modalElement) {
            window._currentFocusTrap = modalElement;
        }
        
        function releaseFocusTrap() {
            window._currentFocusTrap = null;
        }
        
        // Form submission
        document.getElementById('editItemForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = {
                name: formData.get('name'),
                optimal_stock: parseInt(formData.get('optimal_stock')),
                volume: parseFloat(formData.get('volume')),
                weight: parseFloat(formData.get('weight'))
            };
            
            try {
                const result = await API.fetchAPI(`${ITEMS_URL}/item/${itemId}`, {
                    method: 'PUT',
                    body: JSON.stringify(data)
                });

                // Hide the form after successful submission
                document.getElementById('editItemForm').classList.add('hidden');

                if (result.success && result.data && (result.data.status === 'updated' || result.data.status === 'Item updated')) {
                    showSuccessModal();
                } else {
                    showErrorModal();
                }
            } catch (err) {
                console.error('PUT failed:', err);
                showErrorModal();
            }
        };
        
        // Success modal buttons
        document.getElementById('backToItems').onclick = () => {
            window.location.href = '/items/';
        };
        
        document.getElementById('continueEdit').onclick = () => {
            hideModals();
            window.location.reload();
        };
        
        // Error modal button
        document.getElementById('okError').onclick = () => {
            hideModals();
            window.location.reload();
        };
        
        // Keyboard handlers
        document.addEventListener('keydown', (e) => {
            const successModal = document.getElementById('successModal');
            const errorModal = document.getElementById('errorModal');
            
            if (!successModal.classList.contains('hidden') || !errorModal.classList.contains('hidden')) {
                if (e.key === 'Escape') {
                    e.preventDefault();
                    // ESC = Back to all items
                    if (!successModal.classList.contains('hidden')) {
                        document.getElementById('backToItems').click();
                    }
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    // ENTER = Continue editing (reload page)
                    if (!successModal.classList.contains('hidden')) {
                        document.getElementById('continueEdit').click();
                    }
                }
            }
        });
        
        // Load item on page load
        window.onload = loadItem;
    </script>
</body>
</html>
